<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Outlook 邮件管理</title>
    <link rel="icon" href="{{ url_for('favicon', v='gmail-cleaner-local') }}" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #1a1a1a;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 48px;
            width: 400px;
            max-width: 90%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .login-logo svg {
            width: 40px;
            height: 40px;
            color: #1a1a1a;
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            font-size: 15px;
            background-color: #fff;
        }

        .form-input:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px 24px;
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: #333;
        }

        .error-message {
            background-color: #fce8e6;
            color: #c5221f;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </div>
            <h1 class="login-title">Outlook 邮件管理</h1>
        </div>

        {% if login_error %}
        <div class="error-message" id="errorMessage">{{ login_error }}</div>
        {% endif %}

        <form id="loginForm" action="{{ url_for('pocket_id_login') }}" method="get">
            <input type="hidden" name="next" value="{{ next_path }}">
            <div class="form-group">
                <label class="form-label" for="sessionDuration">登录有效期</label>
                <select class="form-input" id="sessionDuration" name="session_duration_days">
                    <option value="7">7 天</option>
                    <option value="30" selected>30 天</option>
                    <option value="90">90 天</option>
                    <option value="180">180 天</option>
                    <option value="permanent">永久有效</option>
                </select>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">登 录</button>
        </form>
    </div>

    <script>
        const LOGIN_DURATION_STORAGE_KEY = 'outlook_login_duration_days';
        const LOGIN_DURATION_OPTIONS = ['7', '30', '90', '180', 'permanent'];
        const DEFAULT_LOGIN_DURATION = '30';
        const sessionDuration = document.getElementById('sessionDuration');

        function loadLoginDurationPreference() {
            let storedValue = '';
            try {
                storedValue = window.localStorage.getItem(LOGIN_DURATION_STORAGE_KEY) || '';
            } catch (error) {
                storedValue = '';
            }
            return LOGIN_DURATION_OPTIONS.includes(storedValue) ? storedValue : DEFAULT_LOGIN_DURATION;
        }

        function saveLoginDurationPreference(value) {
            if (!LOGIN_DURATION_OPTIONS.includes(value)) {
                return;
            }
            try {
                window.localStorage.setItem(LOGIN_DURATION_STORAGE_KEY, value);
            } catch (error) {
                // 本地存储不可用时不阻断登录。
            }
        }

        sessionDuration.value = loadLoginDurationPreference();
        sessionDuration.addEventListener('change', function() {
            saveLoginDurationPreference(sessionDuration.value);
        });
        document.getElementById('loginForm').addEventListener('submit', function() {
            saveLoginDurationPreference(sessionDuration.value);
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = '正在跳转...';
        });
    </script>
</body>
</html>
